
name: Factors Research CI

on:
  push:
    branches:
      - feat/factors-engine-v1
      - research-02-spectral-factor-recovery
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  numerical-validation:
    name: Numerical Validation / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install research package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Static analysis
        run: python -m ruff check .

      - name: Verify formatting
        run: python -m ruff format --check .

      - name: Execute numerical validation tests
        run: python -m pytest -v

      - name: Execute Research 02 spectral recovery tests
        run: python -m pytest -v research_02/tests/test_spectral_recovery.py
